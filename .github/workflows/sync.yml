name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write  # ЭТОЙ СТРОКИ ТЕБЕ НЕ ХВАТАЛО

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # Явно указываем токен

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/deepbeepmeep/WanGP.git
          git fetch upstream main
          # Мержим всё, кроме папки .github
          git merge upstream/main -X theirs --no-edit --no-commit
          git reset HEAD .github/
          git checkout .github/
          git commit -m "Auto-sync with upstream"
          git push origin main
